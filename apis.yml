aid: cluely
name: Cluely
description: >-
  Cluely is an AI meeting assistant that listens to calls in real time,
  transcribes across 12+ languages, and surfaces instant notes, answers, and
  next steps through an on-screen overlay designed to stay undetectable during
  screen sharing. It works across Zoom, Microsoft Teams, and Google Meet, syncs
  with calendars, and offers enterprise capabilities such as CRM/ATS
  integration via Merge.dev, knowledge-base grounding, directory sync, role
  management, and call coaching with ROI reporting. Cluely ships desktop and
  mobile apps plus a first-party command-line interface for managing meeting
  sessions and transcripts from the terminal. Founded by Roy Lee, the company
  raised a Series A led by Andreessen Horowitz and is backed by Susa Ventures.
  There is no public REST API today; this profile captures the developer-facing
  surface Cluely does publish (CLI, changelog, llms.txt, bug bounty).
